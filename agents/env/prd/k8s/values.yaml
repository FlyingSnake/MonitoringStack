environment: prd
target: k8s
enabled: true
inventory: { source: agents/ansible/inventories/prd/k8s/hosts.yml }
alloy:
  version: 1.19.2
  config: { repository: "https://github.com/FlyingSnake/MonitoringStack.git", revision: main, modulePath: agents/alloy/modules/kubernetes/alloy.alloy, pullFrequency: 5m }
endpoints:
  loki: https://loki.ingest.prd.example.internal/loki/api/v1/push
  mimir: https://mimir.ingest.prd.example.internal/api/v1/push
  tempoHttp: https://tempo.ingest.prd.example.internal
  pyroscope: https://pyroscope.ingest.prd.example.internal
security: { authSecretRef: alloy-write-credentials, tlsSecretRef: alloy-client-tls }
features: { logs: true, metrics: true, traces: true, profiling: false }
