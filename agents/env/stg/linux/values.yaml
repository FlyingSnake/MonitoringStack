environment: stg
target: linux
enabled: true
inventory: { source: agents/ansible/inventories/stg/linux/hosts.yml }
alloy:
  version: 1.11.2
  config: { repository: "https://github.com/FlyingSnake/MonitoringStack.git", revision: stg, modulePath: agents/alloy/modules/linux/alloy.alloy, pullFrequency: 5m }
endpoints:
  loki: https://loki.ingest.stg.example.internal/loki/api/v1/push
  mimir: https://mimir.ingest.stg.example.internal/api/v1/push
  tempoHttp: https://tempo.ingest.stg.example.internal
  pyroscope: https://pyroscope.ingest.stg.example.internal
security: { authSecretRef: alloy-write-credentials, tlsSecretRef: alloy-client-tls }
features: { logs: true, metrics: true, traces: true, profiling: true }
