environment: stg
target: windows
enabled: true
inventory: { source: agents/ansible/inventories/stg/windows/hosts.yml }
alloy:
  version: 1.11.2
  config: { repository: "https://github.com/FlyingSnake/MonitoringStack.git", revision: stg, modulePath: agents/alloy/modules/windows/alloy.alloy, pullFrequency: 5m }
endpoints:
  loki: https://loki.stg.example.internal/loki/api/v1/push
  mimir: https://mimir.stg.example.internal/api/v1/push
  tempoGrpc: tempo.stg.example.internal:4317
  pyroscope: https://pyroscope.stg.example.internal
security: { authSecretRef: alloy-write-credentials, tlsSecretRef: alloy-client-tls }
features: { logs: true, metrics: true, traces: true, profiling: false }
