---
alloy_credentials_path: /etc/alloy/credentials
alloy_credentials_environment_file: "{{ alloy_credentials_path }}/environment"
monitoring_environment: dev
vault_addr: ""
vault_kubernetes_role: awx-agent
vault_ingestion_path: monitoring/data/ingestion
vault_service_account_token_path: /var/run/secrets/kubernetes.io/serviceaccount/token
vault_validate_certs: true
