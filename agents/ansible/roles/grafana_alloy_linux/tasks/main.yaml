---
- name: Alloy 시스템 사용자 생성
  ansible.builtin.user:
    name: alloy
    system: true
    shell: /usr/sbin/nologin

- name: Alloy 바이너리 다운로드
  ansible.builtin.get_url:
    url: "{{ alloy_package_url }}"
    dest: "{{ alloy_download_path }}"
    mode: "0644"

- name: Alloy 바이너리 압축 해제
  ansible.builtin.file:
    path: "{{ alloy_extract_path }}"
    state: directory
    mode: "0755"

- name: Alloy 바이너리 압축 해제
  ansible.builtin.unarchive:
    src: "{{ alloy_download_path }}"
    dest: "{{ alloy_extract_path }}"
    remote_src: true
    creates: "{{ alloy_extract_path }}/alloy-linux-amd64"

- name: Alloy 바이너리 설치
  ansible.builtin.copy:
    src: "{{ alloy_extract_path }}/alloy-linux-amd64"
    dest: /usr/local/bin/alloy
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Alloy 재시작

- name: Alloy 설치 디렉터리 생성
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: alloy
    group: alloy
    mode: "0750"
  loop:
    - /etc/alloy
    - /var/lib/alloy

- name: Alloy bootstrap 구성 배포
  ansible.builtin.template:
    src: config.alloy.j2
    dest: "{{ alloy_config_path }}"
    owner: alloy
    group: alloy
    mode: "0640"
  notify: Alloy 재시작

- name: Alloy systemd 서비스 배포
  ansible.builtin.template:
    src: alloy.service.j2
    dest: /etc/systemd/system/alloy.service
    mode: "0644"
  notify:
    - systemd daemon-reload
    - Alloy 재시작
