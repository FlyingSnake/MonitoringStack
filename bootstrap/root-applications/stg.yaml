apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack-stg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    - repoURL: https://github.com/FlyingSnake/MonitoringStack.git
      targetRevision: stg
      path: server/charts/platform-apps
      helm:
        valueFiles:
          - $values/server/values/common.yaml
          - $values/server/env/stg/values.yaml
    - repoURL: https://github.com/FlyingSnake/MonitoringStack.git
      targetRevision: stg
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
