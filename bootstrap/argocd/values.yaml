global:
  domain: argocd.dev.example.internal

crds:
  install: true
  keep: true

configs:
  params:
    server.insecure: false
  cm:
    application.resourceTrackingMethod: annotation
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, platform-admin, role:admin
      g, observability-viewer, role:readonly

server:
  replicas: 2
  service:
    type: ClusterIP

repoServer:
  replicas: 2

controller:
  replicas: 1

applicationSet:
  replicas: 2

redis:
  enabled: true

notifications:
  enabled: true
