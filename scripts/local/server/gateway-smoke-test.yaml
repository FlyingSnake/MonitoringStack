apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-echo
  namespace: envoy-gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-echo
    spec:
      containers:
        - name: echo
          image: ealen/echo-server:0.9.2
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-echo
  namespace: envoy-gateway-system
spec:
  selector:
    app.kubernetes.io/name: gateway-echo
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-echo
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: monitoring-local
  hostnames:
    - echo.ui.localhost
  rules:
    - backendRefs:
        - name: gateway-echo
          port: 80
