# 이 파일을 local/server/values.yaml로 복사한 뒤, Docker/Kind 네트워크와
# 실제 Gateway Service ClusterIP에 맞춰 API CIDR 및 hostAliases를 조정한다.
# 비밀값은 넣지 않으며 Vault bootstrap이 런타임에 생성한다.
gitRevision: dev
repository:
  url: git://host.docker.internal:9418/MonitoringStack.git
project:
  sourceRepos:
    - git://host.docker.internal:9418/MonitoringStack.git
    - https://argoproj.github.io/argo-helm
    - https://helm.releases.hashicorp.com
    - https://charts.jetstack.io
    - https://charts.external-secrets.io
    - https://charts.bitnami.com/bitnami
    - https://grafana-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://charts.redpanda.com
    - https://ansible-community.github.io/awx-operator-helm
applications:
  vault:
    values:
      server:
        standalone:
          enabled: true
          config: |
            ui = true
            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
            }
            storage "file" {
              path = "/tmp/vault"
            }
        dataStorage: { enabled: false }
        auditStorage: { enabled: false }
  platform-foundation:
    values:
      gatewayNamespace: envoy-gateway-system
      # Kind CNI는 Service DNAT 후 Envoy의 HTTPS listener containerPort(10443)를
      # NetworkPolicy와 대조하므로 Service port와 함께 허용한다.
      gatewayEgressPorts: [443, 10443]
      # Kind에서 Service VIP가 control-plane endpoint로 DNAT되므로 두 주소를
      # 함께 허용한다. 실제 환경은 API Service/endpoint CIDR을 values로 제공한다.
      apiServerCidrs: [10.96.0.1/32, 172.18.0.3/32]
      externalEgress:
        - name: awx-local-git
          namespace: awx
          podSelector: { matchLabels: { app.kubernetes.io/name: monitoring-awx-task } }
          cidrs: [192.168.65.254/32]
          ports: [{ protocol: TCP, port: 9418 }]
        - name: awx-execution-helm-https
          namespace: awx
          podSelector:
            matchExpressions:
              - key: ansible-awx
                operator: Exists
          cidrs: [0.0.0.0/0]
          ports: [{ protocol: TCP, port: 443 }]
        - name: awx-linux-fixture-ssh
          namespace: awx
          podSelector:
            matchExpressions:
              - key: ansible-awx
                operator: Exists
          cidrs: [192.168.65.254/32]
          ports: [{ protocol: TCP, port: 2222 }]
        - name: alloy-local-git
          namespace: alloy
          podSelector: {}
          cidrs: [192.168.65.254/32]
          ports: [{ protocol: TCP, port: 9418 }]
      admissionWebhooks:
        - name: allow-kubernetes-api-to-mimir-rollout
          namespace: monitoring-stack-server
          podSelector: { app.kubernetes.io/instance: mimir, app.kubernetes.io/name: rollout-operator }
          apiServerCidrs: [172.18.0.3/32]
          port: 8443
  platform-secrets:
    values:
      vault: { server: "http://vault.vault.svc.cluster.local:8200" }
      gatewaySecretNamespace: envoy-gateway-system
  keycloak:
    values:
      postgresql:
        primary: { persistence: { enabled: false } }
  platform-identity:
    values:
      keycloak:
        hosts: { argocd: "https://argocd.demo.flyingsnake.xyz", grafana: "https://grafana.demo.flyingsnake.xyz", awx: "https://awx.demo.flyingsnake.xyz" }
  minio:
    values:
      persistence: { enabled: false }
  redpanda:
    values:
      storage: { persistentVolume: { enabled: false } }
  platform-observability:
    values:
      grafana: { rootUrl: "https://grafana.demo.flyingsnake.xyz", keycloakUrl: "https://keycloak.demo.flyingsnake.xyz", replicas: 1 }
  platform-gateway:
    values:
      gateway:
        name: monitoring-local
        namespace: envoy-gateway-system
        httpListener: http
        uiListener: grafana-ui-https
        ingestListener: loki-ingest-https
        uiHttpRedirect: { enabled: true, statusCode: 301 }
        vault: { server: "http://vault.vault.svc.cluster.local:8200", signPath: pki_int/sign/monitoring-server, kubernetesAuthMount: /v1/auth/kubernetes, issuerRole: cert-manager-issuer }
        tls:
          managedByCertManager: false
          uiDnsNames: [grafana.demo.flyingsnake.xyz, argocd.demo.flyingsnake.xyz, keycloak.demo.flyingsnake.xyz, awx.demo.flyingsnake.xyz]
          ingestDnsNames: [loki-ingest.demo.flyingsnake.xyz, mimir-ingest.demo.flyingsnake.xyz, tempo-ingest.demo.flyingsnake.xyz, pyroscope-ingest.demo.flyingsnake.xyz]
        ingestListeners: [loki-ingest-https, mimir-ingest-https, tempo-ingest-https, pyroscope-ingest-https]
        uiRoutes:
          - { name: grafana, namespace: grafana, hostname: grafana.demo.flyingsnake.xyz, service: grafana-service, port: 3000, listener: grafana-ui-https }
          - { name: keycloak, namespace: keycloak, hostname: keycloak.demo.flyingsnake.xyz, service: keycloak, port: 80, listener: keycloak-ui-https }
          - { name: argocd, namespace: argocd, hostname: argocd.demo.flyingsnake.xyz, service: argocd-server, port: 80, listener: argocd-ui-https }
          - { name: awx, namespace: awx, hostname: awx.demo.flyingsnake.xyz, service: monitoring-awx-service, port: 80, listener: awx-ui-https }
        ingestionRoutes:
          - { name: loki-ingest, namespace: loki, hostname: loki-ingest.demo.flyingsnake.xyz, service: loki-gateway, port: 80, basicAuthSecret: ingestion-basic-auth, listener: loki-ingest-https }
          - { name: mimir-ingest, namespace: monitoring-stack-server, hostname: mimir-ingest.demo.flyingsnake.xyz, service: mimir-gateway, port: 80, basicAuthSecret: ingestion-basic-auth, listener: mimir-ingest-https }
          - { name: tempo-ingest, namespace: monitoring-stack-server, hostname: tempo-ingest.demo.flyingsnake.xyz, service: tempo-distributor, port: 4318, basicAuthSecret: ingestion-basic-auth, listener: tempo-ingest-https }
          - { name: pyroscope-ingest, namespace: pyroscope, hostname: pyroscope-ingest.demo.flyingsnake.xyz, service: pyroscope, port: 4040, basicAuthSecret: ingestion-basic-auth, listener: pyroscope-ingest-https }
  awx-resources:
    values:
      awx: { projectsPersistence: false, projectsStorageSize: 1Gi, postgresStorageSize: 1Gi }
  awx-config:
    values:
      awx:
        image: monitoring-stack-awx-ee:0.1.1
        repository: git://host.docker.internal:9418/MonitoringStack.git
        revision: dev
        linuxTest:
          enabled: true
          host: host.docker.internal
          port: 2222
          username: alloytest
          credentialSecret: monitoring-linux-test-ssh
        alloyEnvironment:
          LOKI_URL: https://loki-ingest.demo.flyingsnake.xyz/loki/api/v1/push
          MIMIR_REMOTE_WRITE_URL: https://mimir-ingest.demo.flyingsnake.xyz/api/v1/push
          MONITORING_CLUSTER: local-kind
          MONITORING_ENVIRONMENT: dev
          PYROSCOPE_URL: https://pyroscope-ingest.demo.flyingsnake.xyz
          TEMPO_OTLP_HTTP_ENDPOINT: https://tempo-ingest.demo.flyingsnake.xyz
          # Let's Encrypt Gateway 인증서는 Alloy의 OS 신뢰 저장소로 검증한다.
          # ca.crt는 Gateway가 mTLS 클라이언트 인증서를 검증하는 데만 사용한다.
          ALLOY_TLS_CA_FILE: ""
          ALLOY_TLS_CERT_FILE: /etc/alloy/credentials/tls.crt
          ALLOY_TLS_KEY_FILE: /etc/alloy/credentials/tls.key
        alloyWindowsEnvironment:
          LOKI_URL: https://loki-ingest.demo.flyingsnake.xyz/loki/api/v1/push
          MIMIR_REMOTE_WRITE_URL: https://mimir-ingest.demo.flyingsnake.xyz/api/v1/push
          MONITORING_CLUSTER: local-kind
          MONITORING_ENVIRONMENT: dev
          PYROSCOPE_URL: https://pyroscope-ingest.demo.flyingsnake.xyz
          TEMPO_OTLP_HTTP_ENDPOINT: https://tempo-ingest.demo.flyingsnake.xyz
          ALLOY_TLS_CA_FILE: ""
          ALLOY_TLS_CERT_FILE: C:/ProgramData/GrafanaLabs/Alloy/credentials/tls.crt
          ALLOY_TLS_KEY_FILE: C:/ProgramData/GrafanaLabs/Alloy/credentials/tls.key
        alloyHostAliases:
          - ip: 10.96.190.65
            hostnames:
              - loki-ingest.demo.flyingsnake.xyz
              - mimir-ingest.demo.flyingsnake.xyz
              - tempo-ingest.demo.flyingsnake.xyz
              - pyroscope-ingest.demo.flyingsnake.xyz
