repository:
  url: https://github.com/FlyingSnake/MonitoringStack.git
gitRevision: dev
environment: dev
cluster:
  server: https://kubernetes.default.svc
project:
  name: monitoring-platform
  sourceRepos:
    - https://github.com/FlyingSnake/MonitoringStack.git
    - https://argoproj.github.io/argo-helm
    - https://helm.releases.hashicorp.com
    - https://charts.jetstack.io
    - https://charts.external-secrets.io
    - https://charts.bitnami.com/bitnami
    - https://grafana-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://charts.redpanda.com
    - https://ansible-community.github.io/awx-operator-helm

# 환경별 values가 덮어쓰는 배포 계약이다. 아래 Application 기본값은 이 계약만
# 참조하므로 도메인·namespace·Vault·S3·Kafka를 바꿀 때 공통 템플릿을 수정하지 않는다.
platform:
  namespaces:
    monitoring: monitoring-stack-server
  vault:
    address: http://vault.vault.svc.cluster.local:8200
    kvMount: monitoring
    kubernetesAuthMount: kubernetes
    roles:
      secretStore: monitoring-stack
      gatewayIssuer: cert-manager-issuer
      keycloakConfig: keycloak-config
      awxAgent: awx-agent
    paths:
      ingestion: monitoring/data/ingestion
      oidc: monitoring/oidc
      gatewaySign: pki_int/sign/monitoring-server
  objectStorage:
    endpoint: minio.minio.svc.cluster.local:9000
    region: ""
    insecure: true
    forcePathStyle: true
    buckets:
      loki: loki
      tempo: tempo
      mimirBlocks: mimir-blocks
      mimirRuler: mimir-ruler
      mimirAlertmanager: mimir-alertmanager
      pyroscope: pyroscope
  kafka:
    brokers: ["redpanda.redpanda.svc.cluster.local:9093"]
    tls: { enabled: false, serverName: "", caSecretRef: "" }
    sasl: { enabled: false, mechanism: "", secretRef: "" }
    topics: { mimirIngest: mimir-ingest, tempo: tempo }
    autoCreate: { enabled: true, partitions: 3 }
  hosts:
    grafana: grafana.dev.example.internal
    argocd: argocd.dev.example.internal
    keycloak: keycloak.dev.example.internal
    awx: awx.dev.example.internal
    lokiIngest: loki.ingest.dev.example.internal
    mimirIngest: mimir.ingest.dev.example.internal
    tempoIngest: tempo.ingest.dev.example.internal
    pyroscopeIngest: pyroscope.ingest.dev.example.internal
  identity:
    realm: monitoring
    groups: { platformAdmin: platform-admin, observabilityViewer: observability-viewer }
  observability:
    # backend별 resource/retention/persistence chart values를 환경별로 합친다.
    # 예: overrides.loki.loki.limits_config.retention_period
    overrides: {}

applications:
  vault:
    enabled: true
    namespace: vault
    syncWave: "00"
    source: { type: helm, repoURL: "https://helm.releases.hashicorp.com", chart: vault, targetRevision: 0.34.1 }
    values:
      global: { enabled: true }
      injector: { enabled: false }
      ui: { enabled: true, serviceType: ClusterIP }
      server:
        standalone:
          enabled: true
          config: |
            ui = true
            listener "tcp" { tls_disable = 1 address = "[::]:8200" cluster_address = "[::]:8201" }
            storage "raft" { path = "/vault/data" }
        dataStorage: { enabled: true, size: 10Gi }
        auditStorage: { enabled: true, size: 10Gi }

  cert-manager:
    enabled: true
    namespace: cert-manager
    syncWave: "01"
    source: { type: helm, repoURL: "https://charts.jetstack.io", chart: cert-manager, targetRevision: v1.21.1 }
    values: { crds: { enabled: true }, prometheus: { enabled: false } }

  external-secrets:
    enabled: true
    namespace: external-secrets
    syncWave: "01"
    # CRDs are installed once by bootstrap/install-external-secrets-crds.sh with
    # server-side apply; Argo CD's Helm CRD path uses client-side annotations.
    source: { type: helm, repoURL: "https://charts.external-secrets.io", chart: external-secrets, targetRevision: 2.10.0, skipCrds: true }
    values: { installCRDs: false, serviceMonitor: { enabled: false } }

  platform-foundation:
    enabled: true
    namespace: argocd
    # Namespace manifests must exist before independently synced Helm
    # Applications can create namespaced objects.
    syncWave: "-01"
    source: { type: git, path: server/charts/platform-foundation }
    values:
      namespaces:
        - { name: vault }
        - { name: cert-manager }
        - { name: external-secrets }
        - { name: keycloak }
        - { name: minio }
        - { name: redpanda }
        - { name: loki }
        - { name: '{{ .Values.platform.namespaces.monitoring }}' }
        - { name: pyroscope }
        - { name: grafana }
        - { name: blackbox }
        - { name: awx }
        - { name: observability }
        - { name: alloy }
      bootstrapServiceAccounts:
        - { name: external-secrets-vault, namespace: external-secrets }
      protectedNamespaces: [keycloak, minio, redpanda, loki, '{{ .Values.platform.namespaces.monitoring }}', pyroscope, grafana, blackbox, awx, observability, alloy]
      gatewayNamespace: gateway-system
      gatewayEgressPorts: [443]
      alloyRbac: { enabled: true, namespace: alloy, serviceAccountName: alloy, clusterRoleName: alloy }
      externalEgress:
        - name: awx-scm-https
          namespace: awx
          podSelector: { matchLabels: { app.kubernetes.io/name: monitoring-awx-task } }
          cidrs: [0.0.0.0/0]
          ports: [{ protocol: TCP, port: 443 }]
        - name: awx-execution-helm-https
          namespace: awx
          podSelector:
            matchExpressions:
              - key: ansible-awx
                operator: Exists
          cidrs: [0.0.0.0/0]
          ports: [{ protocol: TCP, port: 443 }]

  platform-secrets:
    enabled: true
    namespace: external-secrets
    syncWave: "03"
    source: { type: git, path: server/charts/platform-secrets }
    values:
      vault:
        enabled: true
        storeName: vault-backend
        server: '{{ .Values.platform.vault.address }}'
        kvMount: '{{ .Values.platform.vault.kvMount }}'
        kubernetesAuthMount: '{{ .Values.platform.vault.kubernetesAuthMount }}'
        role: '{{ .Values.platform.vault.roles.secretStore }}'
      gatewaySecretNamespace: gateway-system
      externalSecrets:
        - { name: keycloak-admin, namespace: keycloak, targetSecret: keycloak-admin, keys: [{ secretKey: admin-password, remoteKey: keycloak, property: admin-password }] }
        - { name: keycloak-postgresql, namespace: keycloak, targetSecret: keycloak-postgresql, keys: [{ secretKey: password, remoteKey: keycloak-postgresql, property: password }] }
        - { name: keycloak-bootstrap-user, namespace: keycloak, targetSecret: keycloak-bootstrap-user, keys: [{ secretKey: username, remoteKey: keycloak-user, property: username }, { secretKey: password, remoteKey: keycloak-user, property: password }] }
        - { name: oidc-client-secrets, namespace: keycloak, targetSecret: oidc-client-secrets, keys: [{ secretKey: argocd-client-secret, remoteKey: oidc, property: argocd-client-secret }, { secretKey: grafana-client-secret, remoteKey: oidc, property: grafana-client-secret }, { secretKey: awx-client-secret, remoteKey: oidc, property: awx-client-secret }] }
        - { name: argocd-oidc, namespace: argocd, targetSecret: argocd-secret, creationPolicy: Merge, keys: [{ secretKey: oidc.keycloak.clientSecret, remoteKey: oidc, property: argocd-client-secret }] }
        - { name: oidc-client-secrets, namespace: grafana, targetSecret: oidc-client-secrets, keys: [{ secretKey: grafana-client-secret, remoteKey: oidc, property: grafana-client-secret }] }
        - { name: minio-root, namespace: minio, targetSecret: minio-root, keys: [{ secretKey: root-user, remoteKey: minio, property: root-user }, { secretKey: root-password, remoteKey: minio, property: root-password }] }
        - { name: object-storage-credentials, namespace: loki, targetSecret: object-storage-credentials, keys: [{ secretKey: AWS_ACCESS_KEY_ID, remoteKey: object-storage, property: access-key-id }, { secretKey: AWS_SECRET_ACCESS_KEY, remoteKey: object-storage, property: secret-access-key }] }
        - { name: object-storage-credentials, namespace: '{{ .Values.platform.namespaces.monitoring }}', targetSecret: object-storage-credentials, keys: [{ secretKey: AWS_ACCESS_KEY_ID, remoteKey: object-storage, property: access-key-id }, { secretKey: AWS_SECRET_ACCESS_KEY, remoteKey: object-storage, property: secret-access-key }] }
        - { name: object-storage-credentials, namespace: pyroscope, targetSecret: object-storage-credentials, keys: [{ secretKey: AWS_ACCESS_KEY_ID, remoteKey: object-storage, property: access-key-id }, { secretKey: AWS_SECRET_ACCESS_KEY, remoteKey: object-storage, property: secret-access-key }] }
        - { name: awx-admin, namespace: awx, targetSecret: awx-admin, keys: [{ secretKey: password, remoteKey: awx, property: admin-password }] }
        - { name: oidc-client-secrets, namespace: awx, targetSecret: oidc-client-secrets, keys: [{ secretKey: awx-client-secret, remoteKey: oidc, property: awx-client-secret }] }
        - { name: ingestion-basic-auth, namespace: loki, targetSecret: ingestion-basic-auth, keys: [{ secretKey: .htpasswd, remoteKey: ingestion, property: htpasswd }] }
        - { name: ingestion-basic-auth, namespace: '{{ .Values.platform.namespaces.monitoring }}', targetSecret: ingestion-basic-auth, keys: [{ secretKey: .htpasswd, remoteKey: ingestion, property: htpasswd }] }
        - { name: ingestion-basic-auth, namespace: pyroscope, targetSecret: ingestion-basic-auth, keys: [{ secretKey: .htpasswd, remoteKey: ingestion, property: htpasswd }] }

  keycloak:
    enabled: true
    namespace: keycloak
    syncWave: "10"
    source: { type: helm, repoURL: "https://charts.bitnami.com/bitnami", chart: keycloak, targetRevision: 25.2.0 }
    values:
      image: { repository: bitnamilegacy/keycloak }
      # TLS는 Gateway에서 종료한다. Keycloak은 외부 HTTPS URL과 X-Forwarded
      # 헤더를 사용해 OIDC issuer/endpoint를 생성해야 한다.
      production: true
      proxyHeaders: xforwarded
      httpEnabled: true
      extraEnvVars:
        - { name: KC_HOSTNAME, value: 'https://{{ .Values.platform.hosts.keycloak }}' }
      auth: { adminUser: admin, existingSecret: keycloak-admin, passwordSecretKey: admin-password }
      postgresql:
        enabled: true
        image: { repository: bitnamilegacy/postgresql }
        auth: { username: keycloak, database: keycloak, existingSecret: keycloak-postgresql, secretKeys: { userPasswordKey: password } }
        primary: { persistence: { enabled: true, size: 8Gi } }
      service: { type: ClusterIP }

  platform-identity:
    enabled: true
    namespace: keycloak
    syncWave: "11"
    # Sync Hook Job은 Argo CD가 force recreate한다. Server-Side Apply와
    # 결합하면 kubectl 옵션 충돌이 나므로 이 Application만 일반 apply를 쓴다.
    serverSideApply: false
    source: { type: git, path: server/charts/platform-identity }
    values:
      keycloak:
        realm: '{{ .Values.platform.identity.realm }}'
        internalUrl: http://keycloak.keycloak.svc.cluster.local
        adminSecret: keycloak-admin
        oidcSecret: oidc-client-secrets
        image: adorsys/keycloak-config-cli:6.5.1-26
        vaultAddress: '{{ .Values.platform.vault.address }}'
        vaultKubernetesAuthMount: '{{ .Values.platform.vault.kubernetesAuthMount }}'
        vaultKubernetesAuthRole: '{{ .Values.platform.vault.roles.keycloakConfig }}'
        vaultOidcPath: '{{ .Values.platform.vault.paths.oidc }}'
        groups: { platformAdmin: '{{ .Values.platform.identity.groups.platformAdmin }}', observabilityViewer: '{{ .Values.platform.identity.groups.observabilityViewer }}' }
        hosts: { argocd: 'https://{{ .Values.platform.hosts.argocd }}', grafana: 'https://{{ .Values.platform.hosts.grafana }}', awx: 'https://{{ .Values.platform.hosts.awx }}' }

  minio:
    enabled: true
    namespace: minio
    syncWave: "20"
    source: { type: helm, repoURL: "https://charts.bitnami.com/bitnami", chart: minio, targetRevision: 17.0.21 }
    values:
      image: { repository: bitnamilegacy/minio }
      console: { image: { repository: bitnamilegacy/minio-object-browser } }
      mode: standalone
      auth: { existingSecret: minio-root, rootUserSecretKey: root-user, rootPasswordSecretKey: root-password }
      defaultBuckets: '{{ .Values.platform.objectStorage.buckets.loki }},{{ .Values.platform.objectStorage.buckets.tempo }},{{ .Values.platform.objectStorage.buckets.mimirBlocks }},{{ .Values.platform.objectStorage.buckets.mimirRuler }},{{ .Values.platform.objectStorage.buckets.mimirAlertmanager }},{{ .Values.platform.objectStorage.buckets.pyroscope }}'
      persistence: { enabled: true, size: 50Gi }

  redpanda:
    enabled: true
    namespace: redpanda
    syncWave: "20"
    source: { type: helm, repoURL: "https://charts.redpanda.com", chart: redpanda, targetRevision: 26.2.2 }
    values:
      statefulset: { replicas: 1 }
      storage: { persistentVolume: { enabled: true, size: 20Gi } }
      external: { enabled: false }
      # Redpanda는 dev/stg 내부 NetworkPolicy 경계에서만 사용한다. Mimir와 Tempo의
      # Kafka 클라이언트는 이 내부 평문 리스너를 사용하며, prd는 외부 TLS Kafka를 참조한다.
      tls: { enabled: false }
      # Tempo는 Kafka topic을 자동 생성하지 않으므로, dev/stg의 전용 Redpanda에서만
      # 토픽 자동 생성을 허용한다. prd는 외부 Kafka의 사전 생성 토픽을 사용한다.
      config: { cluster: { auto_create_topics_enabled: true } }

  grafana-operator:
    enabled: true
    namespace: grafana
    syncWave: "30"
    source: { type: helm, repoURL: "https://grafana.github.io/helm-charts", chart: grafana-operator, targetRevision: 5.25.0 }
    values: { crds: { immutable: false }, serviceMonitor: { enabled: false } }

  platform-observability:
    enabled: true
    namespace: grafana
    syncWave: "31"
    source: { type: git, path: server/charts/platform-observability }
    values:
      grafana:
        enabled: true
        rootUrl: 'https://{{ .Values.platform.hosts.grafana }}'
        replicas: 1
        oidcSecret: oidc-client-secrets
        keycloakUrl: 'https://{{ .Values.platform.hosts.keycloak }}'
        keycloakInternalUrl: http://keycloak.keycloak.svc.cluster.local
        realm: '{{ .Values.platform.identity.realm }}'
        # Metrics/Logs/Traces/Profiles Drilldown은 Grafana OSS 13에서 기본 제공되며,
        # 아래 토글은 대시보드 패널에서 Drilldown 후보를 더 잘 노출한다.
        drilldown:
          enabled: true
          featureToggles: [drilldownRecommendations, perPanelNonApplicableDrilldowns, dashboardUnifiedDrilldownControls]
        dashboards:
          - name: service-inventory
            uid: service-inventory
            # Grafana Operator의 `folder: General`은 예약된 기본 General 위치를 뜻한다.
            folder: General
            definition:
              uid: service-inventory
              annotations: { list: [] }
              editable: true
              fiscalYearStartMonth: 0
              graphTooltip: 0
              links: []
              panels:
                - id: 1
                  title: Active Services
                  type: stat
                  datasource: { type: prometheus, uid: mimir }
                  gridPos: { h: 7, w: 6, x: 0, "y": 0 }
                  targets: [{ refId: A, expr: 'count(count by (job) (up))', instant: true }]
                  options: { reduceOptions: { calcs: [lastNotNull], fields: '', values: false }, orientation: auto, textMode: auto }
                - id: 2
                  title: Healthy Targets
                  type: stat
                  datasource: { type: prometheus, uid: mimir }
                  gridPos: { h: 7, w: 6, x: 6, "y": 0 }
                  targets: [{ refId: A, expr: 'sum(up{job=~"$job"} == 1)', instant: true }]
                  options: { reduceOptions: { calcs: [lastNotNull], fields: '', values: false }, orientation: auto, textMode: auto }
                - id: 3
                  title: Unhealthy Targets
                  type: stat
                  datasource: { type: prometheus, uid: mimir }
                  gridPos: { h: 7, w: 6, x: 12, "y": 0 }
                  targets: [{ refId: A, expr: 'sum(up{job=~"$job"} == 0)', instant: true }]
                  options: { reduceOptions: { calcs: [lastNotNull], fields: '', values: false }, orientation: auto, textMode: auto }
                  fieldConfig: { defaults: { thresholds: { mode: absolute, steps: [{ color: green }, { color: red, value: 1 }] } }, overrides: [] }
                - id: 4
                  title: Availability by Service
                  type: timeseries
                  datasource: { type: prometheus, uid: mimir }
                  gridPos: { h: 7, w: 12, x: 0, "y": 7 }
                  targets: [{ refId: A, expr: 'sum by (job) (up{job=~"$job"})', legendFormat: '{{ "{{" }}job{{ "}}" }}' }]
                  fieldConfig: { defaults: { min: 0, max: 1, unit: percentunit }, overrides: [] }
                - id: 5
                  title: Service Targets
                  type: table
                  datasource: { type: prometheus, uid: mimir }
                  gridPos: { h: 9, w: 12, x: 12, "y": 0 }
                  targets: [{ refId: A, expr: 'max by (job, instance) (up{job=~"$job"})', format: table, instant: true }]
                  options: { showHeader: true, cellHeight: sm }
              refresh: 30s
              schemaVersion: 41
              tags: [inventory, services, monitoring-stack]
              templating:
                list:
                  - name: job
                    label: Service
                    type: query
                    datasource: { type: prometheus, uid: mimir }
                    definition: 'label_values(up, job)'
                    query: { query: 'label_values(up, job)', refId: StandardVariableQuery }
                    includeAll: true
                    allValue: '.*'
                    multi: true
                    current: { text: All, value: '$__all' }
              time: { from: now-6h, to: now }
              timezone: browser
              title: Service Inventory
              version: 1
        datasources:
          - { name: loki, uid: loki, displayName: Loki, type: loki, url: "http://loki-gateway.loki.svc.cluster.local", isDefault: false }
          - { name: mimir, uid: mimir, displayName: Mimir, type: prometheus, url: 'http://mimir-gateway.{{ .Values.platform.namespaces.monitoring }}.svc.cluster.local/prometheus', isDefault: true, jsonData: { timeInterval: 15s } }
          - { name: tempo, uid: tempo, displayName: Tempo, type: tempo, url: 'http://tempo-query-frontend.{{ .Values.platform.namespaces.monitoring }}.svc.cluster.local:3200', isDefault: false, jsonData: { tracesToLogsV2: { datasourceUid: loki }, tracesToMetrics: { datasourceUid: mimir }, tracesToProfiles: { datasourceUid: pyroscope }, serviceMap: { datasourceUid: mimir } } }
          - { name: pyroscope, uid: pyroscope, displayName: Pyroscope, type: grafana-pyroscope-datasource, url: "http://pyroscope.pyroscope.svc.cluster.local:4040", isDefault: false }

  loki:
    enabled: true
    namespace: loki
    syncWave: "32"
    source: { type: helm, repoURL: "https://grafana-community.github.io/helm-charts", chart: loki, targetRevision: 18.11.7 }
    values:
      deploymentMode: Distributed
      global:
        extraEnvFrom: [{ secretRef: { name: object-storage-credentials } }]
      defaults:
        extraArgs: ["-config.expand-env=true"]
      loki:
        auth_enabled: false
        commonConfig: { replication_factor: 1 }
        # Logs Drilldown의 Patterns, Log volume, 레벨·서비스 감지를 활성화한다.
        pattern_ingester: { enabled: true }
        limits_config:
          allow_structured_metadata: true
          volume_enabled: true
          discover_log_levels: true
          discover_service_name: [service_name, service, app, app_kubernetes_io_name, container, job]
        schemaConfig: { configs: [{ from: "2024-04-01", store: tsdb, object_store: s3, schema: v13, index: { prefix: loki_index_, period: 24h } }] }
        # MinIO는 virtual-host 방식의 `bucket.minio...` DNS를 제공하지 않으므로
        # path-style S3 요청을 강제한다.
        # Boolean transport options are chart-typed values. 환경별 변경은
        # applications.loki.values.loki.storage.s3에서 typed YAML로 덮어쓴다.
        storage: { type: s3, bucketNames: { chunks: '{{ .Values.platform.objectStorage.buckets.loki }}', ruler: '{{ .Values.platform.objectStorage.buckets.loki }}', admin: '{{ .Values.platform.objectStorage.buckets.loki }}' }, s3: { endpoint: '{{ .Values.platform.objectStorage.endpoint }}', region: '{{ .Values.platform.objectStorage.region }}', insecure: true, s3ForcePathStyle: true, accessKeyId: "${AWS_ACCESS_KEY_ID}", secretAccessKey: "${AWS_SECRET_ACCESS_KEY}" } }
      minio: { enabled: false }
      gateway: { enabled: true }
      singleBinary: { replicas: 0 }
      read: { replicas: 0 }
      write: { replicas: 0 }
      backend: { replicas: 0 }
      ingester: { replicas: 1, zoneAwareReplication: { enabled: false } }
      distributor: { replicas: 1 }
      querier: { replicas: 1 }
      queryFrontend: { replicas: 1 }
      # Distributed 모드의 query frontend는 scheduler 연결이 필요하다.
      queryScheduler: { replicas: 1 }
      # TSDB 인덱스 조회를 위한 index gateway는 분산 모드에서 필수다.
      indexGateway: { replicas: 1 }
      compactor: { replicas: 1 }
      # Grafana Logs Drilldown의 Patterns API를 제공하는 별도 컴포넌트다.
      patternIngester: { enabled: true, replicas: 3 }

  mimir:
    enabled: true
    namespace: '{{ .Values.platform.namespaces.monitoring }}'
    syncWave: "32"
    source: { type: helm, repoURL: "https://grafana.github.io/helm-charts", chart: mimir-distributed, targetRevision: 6.2.0 }
    values:
      minio: { enabled: false }
      kafka: { enabled: false }
      global:
        extraEnvFrom: [{ secretRef: { name: object-storage-credentials } }]
      mimir:
        structuredConfig:
          multitenancy_enabled: false
          common: { storage: { backend: s3, s3: { endpoint: '{{ .Values.platform.objectStorage.endpoint }}', region: '{{ .Values.platform.objectStorage.region }}', insecure: true, access_key_id: "${AWS_ACCESS_KEY_ID}", secret_access_key: "${AWS_SECRET_ACCESS_KEY}" } } }
          blocks_storage: { s3: { bucket_name: '{{ .Values.platform.objectStorage.buckets.mimirBlocks }}', access_key_id: "${AWS_ACCESS_KEY_ID}", secret_access_key: "${AWS_SECRET_ACCESS_KEY}" } }
          ruler_storage: { s3: { bucket_name: '{{ .Values.platform.objectStorage.buckets.mimirRuler }}', access_key_id: "${AWS_ACCESS_KEY_ID}", secret_access_key: "${AWS_SECRET_ACCESS_KEY}" } }
          alertmanager_storage: { s3: { bucket_name: '{{ .Values.platform.objectStorage.buckets.mimirAlertmanager }}', access_key_id: "${AWS_ACCESS_KEY_ID}", secret_access_key: "${AWS_SECRET_ACCESS_KEY}" } }
          ingest_storage: { enabled: true, kafka: { address: '{{ join "," .Values.platform.kafka.brokers }}', topic: '{{ .Values.platform.kafka.topics.mimirIngest }}', auto_create_topic_enabled: true, auto_create_topic_default_partitions: 3 } }
          ingester: { push_grpc_method_enabled: false }
      ingester: { replicas: 1 }
      store_gateway: { replicas: 1 }
      distributor: { replicas: 1 }
      querier: { replicas: 1 }

  tempo:
    enabled: true
    namespace: '{{ .Values.platform.namespaces.monitoring }}'
    syncWave: "32"
    source: { type: helm, repoURL: "https://grafana.github.io/helm-charts", chart: tempo-distributed, targetRevision: 1.61.3 }
    values:
      global:
        extraEnvFrom: [{ secretRef: { name: object-storage-credentials } }]
      multitenancyEnabled: false
      # tempo-distributed chart는 Tempo 저장소를 최상위 storage 값으로 렌더링한다.
      storage: { trace: { backend: s3, s3: { endpoint: '{{ .Values.platform.objectStorage.endpoint }}', region: '{{ .Values.platform.objectStorage.region }}', insecure: true, bucket: '{{ .Values.platform.objectStorage.buckets.tempo }}', access_key: "${AWS_ACCESS_KEY_ID}", secret_key: "${AWS_SECRET_ACCESS_KEY}" } } }
      traces:
        otlp: { grpc: { enabled: true }, http: { enabled: true } }
        # tempo-distributed는 brokers를 YAML 배열로 받는다. 공통 기본값은 첫
        # bootstrap broker를 사용하고, 다중 broker 환경은 env overlay에서 배열로
        # 명시적으로 덮어쓴다.
        kafka: { brokers: ['{{ index .Values.platform.kafka.brokers 0 }}'], topic: '{{ .Values.platform.kafka.topics.tempo }}' }
      # Traces Drilldown의 TraceQL metric과 Mimir의 RED/service graph 조회를 제공한다.
      metricsGenerator:
        enabled: true
        replicas: 3
        # metrics generator도 object-storage-credentials를 사용하는 Tempo 프로세스다.
        # ${AWS_*}를 실제 Secret 환경 변수로 확장하지 않으면 MinIO 인증이 실패한다.
        extraArgs: ["-config.expand-env=true"]
        config:
          processor:
            local_blocks: { filter_server_spans: false, flush_to_storage: true }
          storage:
            remote_write:
              - url: 'http://mimir-gateway.{{ .Values.platform.namespaces.monitoring }}.svc.cluster.local/api/v1/push'
      overrides:
        defaults:
          metrics_generator:
            processors: [local-blocks, service-graphs, span-metrics]
      # 환경 변수로 주입한 객체 저장소 자격증명은 Tempo 프로세스만 확장한다.
      # global.extraArgs는 memcached에도 전달되어 기동 인자를 손상시키므로 사용하지 않는다.
      distributor: { replicas: 1, extraArgs: ["-config.expand-env=true"] }
      ingester: { replicas: 1, extraArgs: ["-config.expand-env=true"] }
      querier: { replicas: 1, extraArgs: ["-config.expand-env=true"] }
      queryFrontend: { replicas: 1, extraArgs: ["-config.expand-env=true"] }
      compactor: { replicas: 1, extraArgs: ["-config.expand-env=true"] }

  pyroscope:
    enabled: true
    namespace: pyroscope
    syncWave: "32"
    source: { type: helm, repoURL: "https://grafana.github.io/helm-charts", chart: pyroscope, targetRevision: 2.2.1 }
    values:
      pyroscope:
        # Pyroscope 차트는 전역 extraEnvFrom을 소비하지 않는다. S3 자격증명은
        # StatefulSet의 환경변수로 주입하고 config 내 ${...}를 명시적으로 확장한다.
        extraArgs: { config.expand-env: "true" }
        extraEnvFrom: [{ secretRef: { name: object-storage-credentials } }]
        config: |
          storage:
            backend: s3
            s3:
              endpoint: '{{ .Values.platform.objectStorage.endpoint }}'
              bucket_name: '{{ .Values.platform.objectStorage.buckets.pyroscope }}'
              access_key_id: ${AWS_ACCESS_KEY_ID}
              secret_access_key: ${AWS_SECRET_ACCESS_KEY}
              insecure: true
      minio: { enabled: false }

  blackbox-exporter:
    enabled: true
    namespace: blackbox
    syncWave: "32"
    source: { type: helm, repoURL: "https://prometheus-community.github.io/helm-charts", chart: prometheus-blackbox-exporter, targetRevision: 11.17.2 }
    values:
      config:
        modules:
          http_2xx: { prober: http, timeout: 5s, http: { valid_http_versions: [HTTP/1.1, HTTP/2.0] } }
          tcp_connect: { prober: tcp, timeout: 5s }
          icmp: { prober: icmp, timeout: 5s }
          dns_udp: { prober: dns, timeout: 5s, dns: { query_name: example.com, query_type: A } }

  server-alloy:
    enabled: true
    namespace: observability
    syncWave: "32"
    source: { type: helm, repoURL: "https://grafana.github.io/helm-charts", chart: alloy, targetRevision: 1.12.1 }
    values:
      controller: { type: deployment, replicas: 1 }
      alloy:
        configMap:
          create: true
          content: |
            prometheus.scrape "blackbox" {
              targets = [{ "__address__" = "blackbox-prometheus-blackbox-exporter.blackbox.svc.cluster.local:9115" }]
              forward_to = [prometheus.remote_write.mimir.receiver]
            }
            prometheus.remote_write "mimir" {
              endpoint { url = "http://mimir-gateway.{{ .Values.platform.namespaces.monitoring }}.svc.cluster.local/api/v1/push" }
            }

  platform-gateway:
    enabled: true
    namespace: gateway-system
    syncWave: "33"
    source: { type: git, path: server/charts/platform-gateway }
    values:
      gateway:
        enabled: true
        name: platform-gateway
        namespace: gateway-system
        uiListener: ui-https
        ingestListener: ingest-https
        issuer: { name: vault-pki, kind: Issuer }
        vault: { server: '{{ .Values.platform.vault.address }}', signPath: '{{ .Values.platform.vault.paths.gatewaySign }}', kubernetesAuthMount: '/v1/auth/{{ .Values.platform.vault.kubernetesAuthMount }}', issuerRole: '{{ .Values.platform.vault.roles.gatewayIssuer }}' }
        tls:
          uiSecretName: monitoring-ui-tls
          ingestSecretName: monitoring-ingest-tls
          uiDnsNames: ['{{ .Values.platform.hosts.grafana }}', '{{ .Values.platform.hosts.argocd }}', '{{ .Values.platform.hosts.keycloak }}', '{{ .Values.platform.hosts.awx }}']
          ingestDnsNames: ['{{ .Values.platform.hosts.lokiIngest }}', '{{ .Values.platform.hosts.mimirIngest }}', '{{ .Values.platform.hosts.tempoIngest }}', '{{ .Values.platform.hosts.pyroscopeIngest }}']
        uiRoutes:
          - { name: grafana, namespace: grafana, hostname: '{{ .Values.platform.hosts.grafana }}', service: grafana-service, port: 3000 }
          - { name: keycloak, namespace: keycloak, hostname: '{{ .Values.platform.hosts.keycloak }}', service: keycloak, port: 80 }
          - { name: argocd, namespace: argocd, hostname: '{{ .Values.platform.hosts.argocd }}', service: argocd-server, port: 80 }
          - { name: awx, namespace: awx, hostname: '{{ .Values.platform.hosts.awx }}', service: monitoring-awx-service, port: 80 }
        ingestionRoutes:
          - { name: loki-ingest, namespace: loki, hostname: '{{ .Values.platform.hosts.lokiIngest }}', service: loki-gateway, port: 80, basicAuthSecret: ingestion-basic-auth }
          - { name: mimir-ingest, namespace: '{{ .Values.platform.namespaces.monitoring }}', hostname: '{{ .Values.platform.hosts.mimirIngest }}', service: mimir-gateway, port: 80, basicAuthSecret: ingestion-basic-auth }
          - { name: tempo-ingest, namespace: '{{ .Values.platform.namespaces.monitoring }}', hostname: '{{ .Values.platform.hosts.tempoIngest }}', service: tempo-distributor, port: 4318, basicAuthSecret: ingestion-basic-auth }
          - { name: pyroscope-ingest, namespace: pyroscope, hostname: '{{ .Values.platform.hosts.pyroscopeIngest }}', service: pyroscope, port: 4040, basicAuthSecret: ingestion-basic-auth }

  awx-operator:
    enabled: true
    namespace: awx
    syncWave: "40"
    source: { type: helm, repoURL: "https://ansible-community.github.io/awx-operator-helm", chart: awx-operator, targetRevision: 3.2.1 }
    values: { }

  awx-resources:
    enabled: true
    namespace: awx
    syncWave: "41"
    source: { type: git, path: server/charts/awx-resources }
    values:
      awx: { enabled: true, name: monitoring-awx, adminPasswordSecret: awx-admin, taskServiceAccount: monitoring-awx, projectsPersistence: true, projectsStorageSize: 10Gi, postgresStorageSize: 8Gi }

  awx-config:
    enabled: true
    namespace: awx
    syncWave: "42"
    source: { type: git, path: server/charts/awx-config }
    values:
      awx:
        enabled: true
        name: monitoring-awx
        url: "http://monitoring-awx-service.awx.svc.cluster.local"
        adminSecret: awx-admin
        oidcSecret: oidc-client-secrets
        image: "quay.io/ansible/awx-ee:24.6.1"
        repository: '{{ .Values.repository.url }}'
        revision: '{{ .Values.gitRevision }}'
        environment: '{{ .Values.environment }}'
        alloyHostAliases: []
