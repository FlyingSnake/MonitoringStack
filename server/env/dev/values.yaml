gitRevision: dev
environment: dev
baseDomain: example.internal
applications:
  vault:
    values:
      server:
        standalone:
          enabled: true
        dataStorage: { enabled: true, size: 10Gi }
        auditStorage: { enabled: true, size: 10Gi }
  platform-identity:
    values:
      keycloak:
        hosts: { argocd: "https://argocd.dev.example.internal", grafana: "https://grafana.dev.example.internal", awx: "https://awx.dev.example.internal" }
  platform-observability:
    values:
      grafana: { rootUrl: "https://grafana.dev.example.internal", keycloakUrl: "https://keycloak.dev.example.internal", replicas: 1 }
  loki:
    values:
      # 개발 환경은 캐시와 canary를 생략해 분산 Loki의 필수 역할만 실행한다.
      chunksCache: { enabled: false }
      resultsCache: { enabled: false }
      lokiCanary: { enabled: false }
      test: { enabled: false }
  mimir:
    values:
      # zone-aware HA와 내장 Kafka는 stg/prd에만 사용한다.
      alertmanager: { replicas: 1, zoneAwareReplication: { enabled: false } }
      compactor: { replicas: 1 }
      distributor: { replicas: 1 }
      ingester: { replicas: 1, zoneAwareReplication: { enabled: false } }
      kafka: { enabled: false }
      mimir:
        structuredConfig:
          ingest_storage: { enabled: false }
      overrides_exporter: { enabled: false }
      querier: { replicas: 1 }
      query_frontend: { replicas: 1 }
      query_scheduler: { enabled: false }
      # 기존 상태에서 scale-down admission webhook을 제공한다. 단일 replica로 유지한다.
      rollout_operator: { enabled: true }
      ruler: { replicas: 1 }
      store_gateway: { replicas: 1, zoneAwareReplication: { enabled: false } }
  pyroscope:
    values:
      # 서버 Alloy Application이 수집을 담당하므로 Pyroscope 차트의 내장 Alloy는 끈다.
      alloy: { enabled: false }
  platform-gateway:
    values:
      gateway:
        name: platform-gateway
        namespace: gateway-system
        uiListener: ui-https
        ingestListener: ingest-https
        tls:
          uiDnsNames: [grafana.dev.example.internal, argocd.dev.example.internal, keycloak.dev.example.internal, awx.dev.example.internal]
          ingestDnsNames: [loki.ingest.dev.example.internal, mimir.ingest.dev.example.internal, tempo.ingest.dev.example.internal, pyroscope.ingest.dev.example.internal]
        uiRoutes:
          - { name: grafana, namespace: grafana, hostname: grafana.dev.example.internal, service: grafana-service, port: 3000 }
          - { name: keycloak, namespace: keycloak, hostname: keycloak.dev.example.internal, service: keycloak, port: 80 }
          - { name: argocd, namespace: argocd, hostname: argocd.dev.example.internal, service: argocd-server, port: 80 }
          - { name: awx, namespace: awx, hostname: awx.dev.example.internal, service: monitoring-awx-service, port: 80 }
        ingestionRoutes:
          - { name: loki-ingest, namespace: loki, hostname: loki.ingest.dev.example.internal, service: loki-gateway, port: 80, basicAuthSecret: ingestion-basic-auth }
          - { name: mimir-ingest, namespace: mimir, hostname: mimir.ingest.dev.example.internal, service: mimir-nginx, port: 80, basicAuthSecret: ingestion-basic-auth }
          - { name: tempo-ingest, namespace: tempo, hostname: tempo.ingest.dev.example.internal, service: tempo-distributor, port: 4318, basicAuthSecret: ingestion-basic-auth }
          - { name: pyroscope-ingest, namespace: pyroscope, hostname: pyroscope.ingest.dev.example.internal, service: pyroscope, port: 4040, basicAuthSecret: ingestion-basic-auth }
