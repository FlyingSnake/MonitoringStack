gitRevision: main
environment: prd
applications:
  platform-resources:
    values:
      vault:
        server: https://vault.prd.example.internal
        role: monitoring-stack-prd
      keycloak: { url: "https://keycloak.prd.example.internal", realm: monitoring }
      gateway: { name: platform-gateway, namespace: gateway-system, sectionName: https }
      grafana: { rootUrl: "https://grafana.prd.example.internal", replicas: 2 }
      routes:
        - { name: grafana, namespace: grafana, hostname: grafana.prd.example.internal, service: grafana-service, port: 3000 }
  minio: { enabled: false }
  redpanda: { enabled: false }
  loki:
    values:
      loki:
        commonConfig: { replication_factor: 3 }
        storage:
          s3: { endpoint: s3.example.internal, insecure: false }
      write: { replicas: 3 }
      read: { replicas: 3 }
      backend: { replicas: 3 }
  mimir:
    values:
      mimir:
        structuredConfig:
          common:
            storage:
              s3: { endpoint: s3.example.internal, insecure: false, bucket_name: mimir }
      ingester: { replicas: 3 }
      store_gateway: { replicas: 3 }
      distributor: { replicas: 3 }
      querier: { replicas: 3 }
  tempo:
    values:
      tempo:
        storage:
          trace:
            s3: { endpoint: s3.example.internal, insecure: false, bucket: tempo }
      ingester: { replicas: 3 }
      distributor: { replicas: 3 }
      querier: { replicas: 3 }
      queryFrontend: { replicas: 3 }
  pyroscope:
    values:
      pyroscope:
        config: |
          storage:
            backend: s3
            s3:
              endpoint: s3.example.internal
              bucket_name: pyroscope
              insecure: false
