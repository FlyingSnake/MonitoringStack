gitRevision: stg
environment: stg
baseDomain: example.internal
platform:
  namespaces: { monitoring: monitoring-stack-server }
  vault:
    address: http://vault.vault.svc.cluster.local:8200
    kvMount: monitoring
    kubernetesAuthMount: kubernetes
    roles: { secretStore: monitoring-stack, gatewayIssuer: cert-manager-issuer, keycloakConfig: keycloak-config, awxAgent: awx-agent }
    paths: { ingestion: monitoring/data/ingestion, oidc: monitoring/oidc, gatewaySign: pki_int/sign/monitoring-server }
  objectStorage:
    endpoint: minio.minio.svc.cluster.local:9000
    region: ""
    insecure: true
    forcePathStyle: true
    buckets: { loki: loki, tempo: tempo, mimirBlocks: mimir-blocks, mimirRuler: mimir-ruler, mimirAlertmanager: mimir-alertmanager, pyroscope: pyroscope }
  kafka:
    brokers: ["redpanda.redpanda.svc.cluster.local:9093"]
    tls: { enabled: false, serverName: "", caSecretRef: "" }
    sasl: { enabled: false, mechanism: "", secretRef: "" }
    topics: { mimirIngest: mimir-ingest, tempo: tempo }
    autoCreate: { enabled: true, partitions: 3 }
  hosts:
    grafana: grafana.stg.example.internal
    argocd: argocd.stg.example.internal
    keycloak: keycloak.stg.example.internal
    awx: awx.stg.example.internal
    lokiIngest: loki.ingest.stg.example.internal
    mimirIngest: mimir.ingest.stg.example.internal
    tempoIngest: tempo.ingest.stg.example.internal
    pyroscopeIngest: pyroscope.ingest.stg.example.internal
  identity:
    realm: monitoring
    groups: { platformAdmin: platform-admin, observabilityViewer: observability-viewer }
  observability:
    overrides: {}
applications:
  platform-foundation:
    values:
      apiServerCidrs: [REQUIRED_KUBERNETES_API_CIDR]
  vault:
    values:
      server:
        standalone: { enabled: false }
        ha:
          enabled: true
          replicas: 3
          raft:
            enabled: true
            setNodeId: true
            config: |
              ui = true
              listener "tcp" { tls_disable = 1 address = "[::]:8200" cluster_address = "[::]:8201" }
              seal "awskms" { region = "REQUIRED_AWS_REGION" kms_key_id = "REQUIRED_KMS_KEY_ARN" }
              storage "raft" { path = "/vault/data" }
              service_registration "kubernetes" {}
        serviceAccount:
          create: true
          annotations: { eks.amazonaws.com/role-arn: REQUIRED_IRSA_ROLE_ARN }
        dataStorage: { enabled: true, size: 50Gi, storageClass: REQUIRED_STORAGE_CLASS }
        auditStorage: { enabled: true, size: 20Gi, storageClass: REQUIRED_STORAGE_CLASS }
  minio:
    values:
      mode: distributed
      statefulset: { replicaCount: 4 }
      defaultBuckets: ""
  redpanda:
    values:
      statefulset: { replicas: 3 }
  keycloak:
    values:
      extraEnvVars:
        - { name: KC_HOSTNAME, value: "https://keycloak.stg.example.internal" }
  platform-identity:
    values:
      keycloak:
        hosts: { argocd: "https://argocd.stg.example.internal", grafana: "https://grafana.stg.example.internal", awx: "https://awx.stg.example.internal" }
  platform-observability:
    values:
      grafana: { rootUrl: "https://grafana.stg.example.internal", keycloakUrl: "https://keycloak.stg.example.internal", replicas: 2 }
  platform-gateway:
    values:
      gateway:
        tls:
          uiDnsNames: [grafana.stg.example.internal, argocd.stg.example.internal, keycloak.stg.example.internal, awx.stg.example.internal]
          ingestDnsNames: [loki.ingest.stg.example.internal, mimir.ingest.stg.example.internal, tempo.ingest.stg.example.internal, pyroscope.ingest.stg.example.internal]
        uiRoutes:
          - { name: grafana, namespace: grafana, hostname: grafana.stg.example.internal, service: grafana-service, port: 3000 }
          - { name: keycloak, namespace: keycloak, hostname: keycloak.stg.example.internal, service: keycloak, port: 80 }
          - { name: argocd, namespace: argocd, hostname: argocd.stg.example.internal, service: argocd-server, port: 80 }
          - { name: awx, namespace: awx, hostname: awx.stg.example.internal, service: monitoring-awx-service, port: 80 }
        ingestionRoutes:
          - { name: loki-ingest, namespace: loki, hostname: loki.ingest.stg.example.internal, service: loki-gateway, port: 80, basicAuthSecret: ingestion-basic-auth }
          - { name: mimir-ingest, namespace: monitoring-stack-server, hostname: mimir.ingest.stg.example.internal, service: mimir-gateway, port: 80, basicAuthSecret: ingestion-basic-auth }
          - { name: tempo-ingest, namespace: monitoring-stack-server, hostname: tempo.ingest.stg.example.internal, service: tempo-distributor, port: 4318, basicAuthSecret: ingestion-basic-auth }
          - { name: pyroscope-ingest, namespace: pyroscope, hostname: pyroscope.ingest.stg.example.internal, service: pyroscope, port: 4040, basicAuthSecret: ingestion-basic-auth }
