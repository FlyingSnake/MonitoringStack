{{- range .Values.namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/part-of: monitoring-stack
{{- end }}
{{- range .Values.admissionWebhooks }}
{{- if .apiServerCidrs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  podSelector:
    matchLabels:
{{ toYaml .podSelector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
{{- range .apiServerCidrs }}
        - ipBlock:
            cidr: {{ . }}
{{- end }}
      ports:
        - protocol: TCP
          port: {{ .port }}
{{- end }}
{{- end }}
{{- range .Values.bootstrapServiceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
{{- end }}
{{- range .Values.protectedNamespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ . }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-stack-and-dns
  namespace: {{ . }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: monitoring-stack
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.gatewayNamespace }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: monitoring-stack
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.gatewayNamespace }}
      ports:
        - { protocol: TCP, port: 443 }
{{- if $.Values.apiServerCidrs }}
    - to:
{{- range $.Values.apiServerCidrs }}
        - ipBlock:
            cidr: {{ . }}
{{- end }}
      ports:
        - { protocol: TCP, port: 443 }
{{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
{{- range .Values.externalEgress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  podSelector:
{{ toYaml .podSelector | nindent 4 }}
  policyTypes: [Egress]
  egress:
    - to:
{{- range .cidrs }}
        - ipBlock:
            cidr: {{ . }}
{{- end }}
      ports:
{{ toYaml .ports | nindent 8 }}
{{- end }}
