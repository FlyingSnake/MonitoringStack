{{- if .Values.grafana.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
  labels:
    dashboards: grafana
spec:
  config:
    server:
      root_url: {{ .Values.grafana.rootUrl | quote }}
    auth:
      disable_login_form: "true"
    auth.generic_oauth:
      enabled: "true"
      name: Keycloak
      allow_sign_up: "true"
      client_id: grafana
      scopes: openid profile email groups
      auth_url: {{ printf "%s/realms/%s/protocol/openid-connect/auth" .Values.keycloak.url .Values.keycloak.realm | quote }}
      token_url: {{ printf "%s/realms/%s/protocol/openid-connect/token" .Values.keycloak.url .Values.keycloak.realm | quote }}
      api_url: {{ printf "%s/realms/%s/protocol/openid-connect/userinfo" .Values.keycloak.url .Values.keycloak.realm | quote }}
  deployment:
    spec:
      replicas: {{ .Values.grafana.replicas }}
  service:
    spec:
      type: ClusterIP
---
{{- range .Values.grafana.datasources }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: {{ .name }}
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: {{ .displayName }}
    type: {{ .type }}
    access: proxy
    url: {{ .url }}
    isDefault: {{ .isDefault | default false }}
---
{{- end }}
{{- end }}
