{{- range $name, $app := .Values.applications }}
{{- if $app.enabled }}
{{- $appValues := deepCopy $app.values }}
{{- with (index ($.Values.platform.observability.overrides | default dict) $name) }}
{{- $appValues = mergeOverwrite $appValues . }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $.Values.project.name }}
  destination:
    server: {{ $.Values.cluster.server | quote }}
    namespace: {{ tpl (toString $app.namespace) $ | quote }}
  source:
    {{- if eq $app.source.type "helm" }}
    chart: {{ $app.source.chart | quote }}
    repoURL: {{ $app.source.repoURL | quote }}
    targetRevision: {{ tpl (toString $app.source.targetRevision) $ | quote }}
    helm:
      releaseName: {{ $app.releaseName | default $name | quote }}
      {{- if $app.source.skipCrds }}
      skipCrds: true
      {{- end }}
      valuesObject:
        {{- tpl (toYaml $appValues) $ | nindent 8 }}
    {{- else }}
    repoURL: {{ $.Values.repository.url | quote }}
    targetRevision: {{ $.Values.gitRevision | quote }}
    path: {{ $app.source.path | quote }}
    helm:
      releaseName: {{ $app.releaseName | default $name | quote }}
      valuesObject:
        {{- tpl (toYaml $appValues) $ | nindent 8 }}
    {{- end }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      {{- if or (not (hasKey $app "serverSideApply")) $app.serverSideApply }}
      - ServerSideApply=true
      {{- end }}
      {{- range $app.syncOptions }}
      - {{ . | quote }}
      {{- end }}
{{- end }}
{{- end }}
