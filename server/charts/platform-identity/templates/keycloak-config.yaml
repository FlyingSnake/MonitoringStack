apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: keycloak
data:
  monitoring-realm.json: |
    {
      "realm": {{ .Values.keycloak.realm | quote }},
      "enabled": true,
      "displayName": "MonitoringStack",
      "groups": [
        {"name": "platform-admin"},
        {"name": "observability-viewer"}
      ],
      "roles": {
        "realm": [
          {"name": "platform-admin", "description": "Monitoring platform administrator"},
          {"name": "observability-viewer", "description": "Observability read-only user"}
        ]
      },
      "clients": [
        {
          "clientId": "argocd",
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "${ARGOCD_CLIENT_SECRET}",
          "redirectUris": [{{ printf "%s/auth/callback" .Values.keycloak.hosts.argocd | quote }}],
          "webOrigins": [{{ .Values.keycloak.hosts.argocd | quote }}],
          "defaultClientScopes": ["profile", "email", "roles", "groups"]
        },
        {
          "clientId": "grafana",
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "${GRAFANA_CLIENT_SECRET}",
          "redirectUris": [{{ printf "%s/login/generic_oauth" .Values.keycloak.hosts.grafana | quote }}],
          "webOrigins": [{{ .Values.keycloak.hosts.grafana | quote }}],
          "defaultClientScopes": ["profile", "email", "roles", "groups"]
        },
        {
          "clientId": "awx",
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "${AWX_CLIENT_SECRET}",
          "redirectUris": [{{ printf "%s/sso/complete/oidc/" .Values.keycloak.hosts.awx | quote }}],
          "webOrigins": [{{ .Values.keycloak.hosts.awx | quote }}],
          "defaultClientScopes": ["profile", "email", "roles", "groups"]
        }
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: keycloak-config-cli
          image: {{ .Values.keycloak.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.internalUrl | quote }}
            - name: KEYCLOAK_USER
              value: admin
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminSecret }}
                  key: admin-password
            - name: IMPORT_FILES_LOCATIONS
              value: /config/*
            - name: ARGOCD_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.keycloak.oidcSecret }}, key: argocd-client-secret }
            - name: GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.keycloak.oidcSecret }}, key: grafana-client-secret }
            - name: AWX_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.keycloak.oidcSecret }}, key: awx-client-secret }
          volumeMounts:
            - name: realm
              mountPath: /config
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm-config
