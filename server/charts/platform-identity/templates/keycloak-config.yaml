apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: keycloak
data:
  monitoring-realm.json: |
    {
      "realm": {{ .Values.keycloak.realm | quote }},
      "enabled": true,
      "displayName": "MonitoringStack",
      "groups": [
        {"name": {{ .Values.keycloak.groups.platformAdmin | quote }}},
        {"name": {{ .Values.keycloak.groups.observabilityViewer | quote }} }
      ],
      "roles": {
        "realm": [
          {"name": {{ .Values.keycloak.groups.platformAdmin | quote }}, "description": "Monitoring platform administrator"},
          {"name": {{ .Values.keycloak.groups.observabilityViewer | quote }}, "description": "Observability read-only user"}
        ]
      },
      "clientScopes": [
        {
          "name": "groups",
          "description": "Monitoring platform group membership",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "claim.name": "groups"
              }
            }
          ]
        }
      ],
      {{- if .Values.keycloak.bootstrapUser.enabled }}
      "users": [
        {
          "username": "$(env:MONITORING_BOOTSTRAP_USERNAME)",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Monitoring",
          "lastName": "Administrator",
          "email": "platform-admin@local.invalid",
          "groups": [{{ .Values.keycloak.groups.platformAdmin | quote }}],
          "realmRoles": [{{ .Values.keycloak.groups.platformAdmin | quote }}],
          "credentials": [
            {"type": "password", "userLabel": "initial", "value": "$(env:MONITORING_BOOTSTRAP_PASSWORD)", "temporary": false}
          ]
        }
      ],
      {{- end }}
      "clients": [
        {
          "clientId": "argocd",
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "$(env:ARGOCD_CLIENT_SECRET)",
          "redirectUris": [{{ printf "%s/auth/callback" .Values.keycloak.hosts.argocd | quote }}],
          "webOrigins": [{{ .Values.keycloak.hosts.argocd | quote }}],
          "defaultClientScopes": ["profile", "email", "roles", "groups"]
        },
        {
          "clientId": "grafana",
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "$(env:GRAFANA_CLIENT_SECRET)",
          "redirectUris": [{{ printf "%s/login/generic_oauth" .Values.keycloak.hosts.grafana | quote }}],
          "webOrigins": [{{ .Values.keycloak.hosts.grafana | quote }}],
          "defaultClientScopes": ["profile", "email", "roles", "groups"]
        },
        {
          "clientId": "awx",
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "$(env:AWX_CLIENT_SECRET)",
          "redirectUris": [{{ printf "%s/sso/complete/oidc/" .Values.keycloak.hosts.awx | quote }}],
          "webOrigins": [{{ .Values.keycloak.hosts.awx | quote }}],
          "defaultClientScopes": ["profile", "email", "roles", "groups"]
        }
      ]
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-config
  namespace: keycloak
  labels:
    app.kubernetes.io/managed-by: monitoring-stack
    app.kubernetes.io/name: keycloak-config
automountServiceAccountToken: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: keycloak-config
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: keycloak-config-cli
          image: {{ .Values.keycloak.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.internalUrl | quote }}
            - name: KEYCLOAK_USER
              value: admin
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminSecret }}
                  key: admin-password
            - name: IMPORT_FILES_LOCATIONS
              value: /config/*
            - name: IMPORT_VAR_SUBSTITUTION_ENABLED
              value: "true"
            - name: ARGOCD_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.keycloak.oidcSecret }}, key: argocd-client-secret }
            - name: GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.keycloak.oidcSecret }}, key: grafana-client-secret }
            - name: AWX_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.keycloak.oidcSecret }}, key: awx-client-secret }
            {{- if .Values.keycloak.bootstrapUser.enabled }}
            - name: MONITORING_BOOTSTRAP_USERNAME
              valueFrom:
                secretKeyRef: { name: {{ .Values.keycloak.bootstrapUser.secret }}, key: {{ .Values.keycloak.bootstrapUser.usernameKey }} }
            - name: MONITORING_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.keycloak.bootstrapUser.secret }}, key: {{ .Values.keycloak.bootstrapUser.passwordKey }} }
            {{- end }}
          volumeMounts:
            - name: realm
              mountPath: /config
        # Keycloak Config CLI가 client를 만든 뒤 실제 생성된 confidential
        # client secret을 읽어 메모리 volume으로 넘긴다.
        - name: read-keycloak-client-secrets
          image: {{ .Values.keycloak.adminImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export HOME=/tmp/kcadm
              mkdir -p "${HOME}"
              for attempt in $(seq 1 60); do
                if /opt/bitnami/keycloak/bin/kcadm.sh config credentials \
                  --server "${KEYCLOAK_URL}" --realm master --user admin --password "${KEYCLOAK_PASSWORD}" >/dev/null 2>&1; then
                  ready=true
                  for client in argocd grafana awx; do
                    client_id="$(/opt/bitnami/keycloak/bin/kcadm.sh get clients -r {{ .Values.keycloak.realm | quote }} -q clientId="${client}" \
                      | sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p' | head -n1)"
                    if [ -z "${client_id}" ]; then
                      ready=false
                      break
                    fi
                    /opt/bitnami/keycloak/bin/kcadm.sh get "clients/${client_id}/client-secret" -r {{ .Values.keycloak.realm | quote }} \
                      | sed -n 's/.*"value" *: *"\([^"]*\)".*/\1/p' > "/work/${client}"
                    test -s "/work/${client}" || ready=false
                  done
                  if [ "${ready}" = true ]; then
                    chmod 0640 /work/argocd /work/grafana /work/awx
                    touch /work/ready
                    exit 0
                  fi
                fi
                sleep 1
              done
              exit 1
          env:
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.internalUrl | quote }}
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminSecret }}
                  key: admin-password
          volumeMounts:
            - name: oidc-client-secrets
              mountPath: /work
        # Vault token은 이 Job의 ServiceAccount JWT로만 발급되며, policy는
        # monitoring/oidc 경로의 읽기·쓰기로 제한한다.
        - name: write-vault
          image: {{ .Values.keycloak.vaultImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for attempt in $(seq 1 60); do
                test -f /work/ready && break
                sleep 1
              done
              test -f /work/ready
              export VAULT_TOKEN="$(vault write -field=token auth/${VAULT_KUBERNETES_AUTH_MOUNT}/login \
                role="${VAULT_KUBERNETES_AUTH_ROLE}" \
                jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)")"
              vault kv put "${VAULT_OIDC_PATH}" \
                argocd-client-secret="$(cat /work/argocd)" \
                grafana-client-secret="$(cat /work/grafana)" \
                awx-client-secret="$(cat /work/awx)" >/dev/null
          env:
            - name: VAULT_ADDR
              value: {{ .Values.keycloak.vaultAddress | quote }}
            - name: VAULT_KUBERNETES_AUTH_ROLE
              value: {{ .Values.keycloak.vaultKubernetesAuthRole | quote }}
            - name: VAULT_KUBERNETES_AUTH_MOUNT
              value: {{ .Values.keycloak.vaultKubernetesAuthMount | quote }}
            - name: VAULT_OIDC_PATH
              value: {{ .Values.keycloak.vaultOidcPath | quote }}
          volumeMounts:
            - name: oidc-client-secrets
              mountPath: /work
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm-config
        - name: oidc-client-secrets
          emptyDir:
            medium: Memory
