apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: keycloak
data:
  monitoring-realm.json: |
    {
      "realm": {{ .Values.keycloak.realm | quote }},
      "enabled": true,
      "displayName": "MonitoringStack",
      "groups": [
        {"name": "platform-admin"},
        {"name": "observability-viewer"}
      ],
      "roles": {
        "realm": [
          {"name": "platform-admin", "description": "Monitoring platform administrator"},
          {"name": "observability-viewer", "description": "Observability read-only user"}
        ]
      },
      "clientScopes": [
        {
          "name": "groups",
          "description": "Monitoring platform group membership",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "claim.name": "groups"
              }
            }
          ]
        }
      ],
      {{- if .Values.keycloak.bootstrapUser.enabled }}
      "users": [
        {
          "username": "$(env:MONITORING_BOOTSTRAP_USERNAME)",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Monitoring",
          "lastName": "Administrator",
          "email": "platform-admin@local.invalid",
          "groups": ["platform-admin"],
          "realmRoles": ["platform-admin"],
          "credentials": [
            {"type": "password", "userLabel": "initial", "value": "$(env:MONITORING_BOOTSTRAP_PASSWORD)", "temporary": false}
          ]
        }
      ],
      {{- end }}
      "clients": [
        {
          "clientId": "argocd",
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "$(env:ARGOCD_CLIENT_SECRET)",
          "redirectUris": [{{ printf "%s/auth/callback" .Values.keycloak.hosts.argocd | quote }}],
          "webOrigins": [{{ .Values.keycloak.hosts.argocd | quote }}],
          "defaultClientScopes": ["profile", "email", "roles", "groups"]
        },
        {
          "clientId": "grafana",
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "$(env:GRAFANA_CLIENT_SECRET)",
          "redirectUris": [{{ printf "%s/login/generic_oauth" .Values.keycloak.hosts.grafana | quote }}],
          "webOrigins": [{{ .Values.keycloak.hosts.grafana | quote }}],
          "defaultClientScopes": ["profile", "email", "roles", "groups"]
        },
        {
          "clientId": "awx",
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "$(env:AWX_CLIENT_SECRET)",
          "redirectUris": [{{ printf "%s/sso/complete/oidc/" .Values.keycloak.hosts.awx | quote }}],
          "webOrigins": [{{ .Values.keycloak.hosts.awx | quote }}],
          "defaultClientScopes": ["profile", "email", "roles", "groups"]
        }
      ]
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-config
  namespace: keycloak
  labels:
    app.kubernetes.io/managed-by: monitoring-stack
    app.kubernetes.io/name: keycloak-config
automountServiceAccountToken: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: keycloak-config
      containers:
        - name: keycloak-config-cli
          image: {{ .Values.keycloak.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.internalUrl | quote }}
            - name: KEYCLOAK_USER
              value: admin
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminSecret }}
                  key: admin-password
            - name: IMPORT_FILES_LOCATIONS
              value: /config/*
            - name: IMPORT_VAR_SUBSTITUTION_ENABLED
              value: "true"
            - name: ARGOCD_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.keycloak.oidcSecret }}, key: argocd-client-secret }
            - name: GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.keycloak.oidcSecret }}, key: grafana-client-secret }
            - name: AWX_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.keycloak.oidcSecret }}, key: awx-client-secret }
            {{- if .Values.keycloak.bootstrapUser.enabled }}
            - name: MONITORING_BOOTSTRAP_USERNAME
              valueFrom:
                secretKeyRef: { name: {{ .Values.keycloak.bootstrapUser.secret }}, key: {{ .Values.keycloak.bootstrapUser.usernameKey }} }
            - name: MONITORING_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.keycloak.bootstrapUser.secret }}, key: {{ .Values.keycloak.bootstrapUser.passwordKey }} }
            {{- end }}
          volumeMounts:
            - name: realm
              mountPath: /config
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm-config
---
# Keycloak은 confidential client를 생성할 때 client secret을 자체 생성한다.
# 이 Hook은 실제 생성된 값을 Vault에 반영한다. 그 다음 platform-secrets를
# 수동 Sync하면 Grafana·Argo CD·AWX가 같은 값을 ExternalSecret으로 받는다.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-oidc-secret-sync
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
    # Replace는 ServerSideApply보다 우선한다. Hook Job의 force recreate에
    # 필요한 kubectl 옵션 조합을 Argo CD가 명확하게 선택하도록 한다.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: monitoring-stack
        app.kubernetes.io/name: keycloak-oidc-secret-sync
    spec:
      restartPolicy: OnFailure
      serviceAccountName: keycloak-config
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: oidc-client-secrets
          emptyDir:
            medium: Memory
      containers:
        - name: read-keycloak-client-secrets
          image: {{ .Values.keycloak.adminImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export HOME=/tmp/kcadm
              mkdir -p "${HOME}"
              /opt/bitnami/keycloak/bin/kcadm.sh config credentials \
                --server "${KEYCLOAK_URL}" --realm master --user admin --password "${KEYCLOAK_PASSWORD}" >/dev/null
              for client in argocd grafana awx; do
                client_id="$(/opt/bitnami/keycloak/bin/kcadm.sh get clients -r {{ .Values.keycloak.realm | quote }} -q clientId="${client}" \
                  | sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p' | head -n1)"
                test -n "${client_id}"
                /opt/bitnami/keycloak/bin/kcadm.sh get "clients/${client_id}/client-secret" -r {{ .Values.keycloak.realm | quote }} \
                  | sed -n 's/.*"value" *: *"\([^"]*\)".*/\1/p' > "/work/${client}"
                test -s "/work/${client}"
              done
              chmod 0640 /work/argocd /work/grafana /work/awx
              touch /work/ready
          env:
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.internalUrl | quote }}
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminSecret }}
                  key: admin-password
          volumeMounts:
            - name: oidc-client-secrets
              mountPath: /work
        - name: write-vault
          image: {{ .Values.keycloak.vaultImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for attempt in $(seq 1 60); do
                test -f /work/ready && break
                sleep 1
              done
              test -f /work/ready
              export VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login \
                role="${VAULT_KUBERNETES_AUTH_ROLE}" \
                jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)")"
              vault kv put monitoring/oidc \
                argocd-client-secret="$(cat /work/argocd)" \
                grafana-client-secret="$(cat /work/grafana)" \
                awx-client-secret="$(cat /work/awx)" >/dev/null
          env:
            - name: VAULT_ADDR
              value: {{ .Values.keycloak.vaultAddress | quote }}
            - name: VAULT_KUBERNETES_AUTH_ROLE
              value: {{ .Values.keycloak.vaultKubernetesAuthRole | quote }}
          volumeMounts:
            - name: oidc-client-secrets
              mountPath: /work
