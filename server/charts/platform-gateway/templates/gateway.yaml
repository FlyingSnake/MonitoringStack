{{- if .Values.gateway.enabled }}
{{- if .Values.gateway.tls.managedByCertManager }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.gateway.issuer.name }}
  namespace: {{ .Values.gateway.namespace }}
spec:
  vault:
    server: {{ .Values.gateway.vault.server | quote }}
    path: {{ .Values.gateway.vault.signPath | quote }}
    auth:
      kubernetes:
        mountPath: {{ .Values.gateway.vault.kubernetesAuthMount | quote }}
        role: {{ .Values.gateway.vault.issuerRole | quote }}
        serviceAccountRef:
          name: cert-manager-vault-issuer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-vault-issuer
  namespace: {{ .Values.gateway.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-vault-token-requester
  namespace: {{ .Values.gateway.namespace }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-vault-token-requester
  namespace: {{ .Values.gateway.namespace }}
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-vault-token-requester
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-ui-tls
  namespace: {{ .Values.gateway.namespace }}
spec:
  secretName: {{ .Values.gateway.tls.uiSecretName }}
  commonName: {{ index .Values.gateway.tls.uiDnsNames 0 | quote }}
  issuerRef:
    name: {{ .Values.gateway.issuer.name }}
    kind: {{ .Values.gateway.issuer.kind }}
  dnsNames:
    {{- toYaml .Values.gateway.tls.uiDnsNames | nindent 4 }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-ingest-tls
  namespace: {{ .Values.gateway.namespace }}
spec:
  secretName: {{ .Values.gateway.tls.ingestSecretName }}
  commonName: {{ index .Values.gateway.tls.ingestDnsNames 0 | quote }}
  issuerRef:
    name: {{ .Values.gateway.issuer.name }}
    kind: {{ .Values.gateway.issuer.kind }}
  dnsNames:
    {{- toYaml .Values.gateway.tls.ingestDnsNames | nindent 4 }}
{{- end }}
{{- if .Values.gateway.uiHttpRedirect.enabled }}
{{- range .Values.gateway.uiRoutes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}-https-redirect
  namespace: {{ .namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: {{ $.Values.gateway.httpListener }}
  hostnames: [{{ .hostname | quote }}]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: {{ $.Values.gateway.uiHttpRedirect.statusCode }}
{{- end }}
{{- end }}
{{- range .Values.gateway.uiRoutes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: {{ default $.Values.gateway.uiListener .listener }}
  hostnames: [{{ .hostname | quote }}]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .service }}
          port: {{ .port }}
          weight: 1
{{- end }}
{{- range .Values.gateway.ingestionRoutes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: {{ default $.Values.gateway.ingestListener .listener }}
  hostnames: [{{ .hostname | quote }}]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .service }}
          port: {{ .port }}
          weight: 1
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .name }}-basic-auth
  namespace: {{ .namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .name }}
  basicAuth:
    users:
      group: ""
      kind: Secret
      name: {{ .basicAuthSecret }}
{{- end }}
{{- end }}
