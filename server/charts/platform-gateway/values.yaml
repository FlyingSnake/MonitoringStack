gateway:
  enabled: false
  name: platform-gateway
  namespace: gateway-system
  httpListener: http
  uiListener: ui-https
  ingestListener: ingest-https
  uiHttpRedirect:
    enabled: false
    statusCode: 301
  issuer:
    name: vault-pki
    kind: Issuer
  tls:
    # true이면 cert-manager Issuer/Certificate를 렌더링한다. 외부에서 발급한
    # TLS Secret을 주입하는 로컬 데모에서는 false로 설정한다.
    managedByCertManager: true
    uiSecretName: monitoring-ui-tls
    ingestSecretName: monitoring-ingest-tls
    uiDnsNames: []
    ingestDnsNames: []
  uiRoutes: []
  ingestionRoutes: []
