{{- if .Values.vault.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.vault.storeName }}
spec:
  provider:
    vault:
      server: {{ .Values.vault.server | quote }}
      path: {{ .Values.vault.kvMount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.vault.kubernetesAuthMount | quote }}
          role: {{ .Values.vault.role | quote }}
          serviceAccountRef:
            name: external-secrets-vault
            namespace: external-secrets
{{- end }}
{{- range .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  refreshInterval: {{ .refreshInterval | default "1h" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.vault.storeName }}
  target:
    name: {{ .targetSecret }}
    creationPolicy: {{ .creationPolicy | default "Owner" }}
    template:
      type: {{ .targetType | default "Opaque" }}
  data:
    {{- range .keys }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- with .property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
